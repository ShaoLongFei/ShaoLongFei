# 根据 GitHub 贡献图生成贪吃蛇动画，产物推到 output 分支，再被 README 引用
name: Generate Snake

on:
  # 每天 UTC 00:00（北京时间 08:00）刷新一次
  schedule:
    - cron: "0 0 * * *"

  # 手动触发
  workflow_dispatch:

  # 只监听 master：产物推到 output 分支，所以不会自己触发自己
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 抓取 <github_user_name> 的贡献图，输出 svg 动画
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 把产物推到 output 分支，可在 https://raw.githubusercontent.com/<user>/<repo>/output/<file> 访问
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
